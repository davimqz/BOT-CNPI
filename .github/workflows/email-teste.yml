# "Enviar e-mail de teste" (Fase 6 do TASKS.md), rodando de dentro do Actions.
#
# Por que existe, se `npm run email:teste` já roda na máquina do usuário: o que
# importa não é se a chave funciona no seu `.env`, é se ela funciona **a partir
# do runner**, com os secrets do repositório. São duas configurações diferentes,
# e é a segunda que manda os alertas de verdade. Descobrir que ela está errada
# no dia do primeiro despacho é descobrir tarde demais.
#
# SÓ `workflow_dispatch`, nunca agendado: e-mail de teste recorrente treina o
# usuário a ignorar mensagem do sistema — exatamente o que não pode acontecer
# com o canal que avisa de prazo.
#
# Ao contrário dos outros workflows de e-mail, este FALHA (vermelho) quando não
# há provedor configurado. Nos demais, e-mail não configurado é um aviso no log:
# não é motivo para derrubar a ingestão da RPI. Aqui é o contrário — verificar o
# canal é a única coisa que este workflow faz, então "não deu para verificar" é
# um resultado negativo, não um sucesso silencioso.
name: E-mail de teste

on:
  workflow_dispatch:
    inputs:
      destino:
        description: 'Destinatário (vazio = e-mail do usuário cadastrado)'
        required: false
        type: string

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Enviar e-mail de teste
        # `$DESTINO` via env e entre aspas, nunca `${{ inputs.destino }}` direto
        # no `run`: interpolação de input no shell é injeção de comando (o valor
        # entraria no script antes de virar argumento). Vazio some sozinho e o
        # worker cai no destinatário padrão.
        run: npm run email:teste -- "$DESTINO"
        env:
          DESTINO: ${{ inputs.destino }}
          # O worker lê o destinatário padrão do banco quando `destino` vem vazio.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Provedor padrão. Bastam estes dois secrets para o envio funcionar.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_RESPONDER_PARA: ${{ secrets.EMAIL_RESPONDER_PARA }}
          # Fallback: só entra em ação se os dois acima estiverem vazios.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_CRIPTOGRAFIA: ${{ secrets.SMTP_CRIPTOGRAFIA }}
          RESUMO_PRAZOS_PARA: ${{ secrets.RESUMO_PRAZOS_PARA }}
