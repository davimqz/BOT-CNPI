name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # O postinstall roda `prisma generate` (não precisa de banco).
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test
