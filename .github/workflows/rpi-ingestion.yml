# Ingestão semanal da RPI (ver CLAUDE.md Seção 3.1 e skill rpi-ingestion-despachos).
# Esqueleto da Fase 0 — o script `ingest:rpi` é implementado na Fase 1 do TASKS.md.
name: Ingestão RPI

on:
  schedule:
    # A RPI parece ficar disponível no servidor de madrugada, não às 09h: nas
    # edições 2899/2900 a janela das 09:00 BRT já baixou de primeira (sem 404),
    # e um concorrente ("Marca Acompanhada") notificou o usuário sobre a mesma
    # marca às 01h30 da terça (11/08/2026) — o que só bate com "checar antes do
    # pico de tráfego da manhã". A infraestrutura do INPI costuma ficar instável
    # justo nessa janela da manhã (visto em 28/07: 403; em 11/08: 503 persistente
    # até depois das 09h). Quatro janelas — a ingestão é idempotente, rodada
    # extra não grava nada em duplicidade.
    # Gotcha: o GitHub desativa `schedule` em repositórios sem atividade há 60+ dias.
    - cron: '0 4 * * 2'  # terça 01:00 BRT — tenta antes do pico de tráfego da manhã
    - cron: '0 12 * * 2' # terça 09:00 BRT
    - cron: '0 17 * * 2' # terça 14:00 BRT
    - cron: '0 12 * * 3' # quarta 09:00 BRT (rede de segurança)
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 404 no download da edição = "ainda não publicada": o script deve terminar
      # com sucesso sem gravar nada (o agendamento tenta de novo na próxima terça).
      - name: Ingerir edição da RPI
        run: npm run ingest:rpi --if-present
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Variable (não secret) `RPI_MODO_ENXUTO = 1` faz a ingestão semanal
          # gravar só os despachos das suas marcas — a revista continua sendo
          # baixada e cruzada por inteiro. É o que mantém o banco estável no
          # plano gratuito. Vazia = modo completo (padrão). Ver CLAUDE.md 3.1.1.
          RPI_MODO_ENXUTO: ${{ vars.RPI_MODO_ENXUTO }}

      # Janela móvel do Histórico RPI, só quando explicitamente configurada:
      # defina a variable `RPI_JANELA_EDICOES` (ex: 12) para manter as N edições
      # mais recentes completas e descartar o "resto da revista" das antigas.
      # Sem a variable, nada é apagado — apagar dado nunca pode ser efeito
      # colateral de atualizar o código.
      - name: Manter a janela do Histórico RPI
        if: vars.RPI_JANELA_EDICOES != ''
        run: npm run ingest:rpi -- --limpar=${{ vars.RPI_JANELA_EDICOES }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Aqui, e não num workflow à parte: o alerta precisa sair junto da detecção.
      # O que falhar continua na fila e é reprocessado pelo alertas.yml diário.
      - name: Enviar alertas da edição processada
        run: npm run alertas:enviar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_RESPONDER_PARA: ${{ secrets.EMAIL_RESPONDER_PARA }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_CRIPTOGRAFIA: ${{ secrets.SMTP_CRIPTOGRAFIA }}
