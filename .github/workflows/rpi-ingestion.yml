# Ingestão semanal da RPI (ver CLAUDE.md Seção 3.1 e skill rpi-ingestion-despachos).
# Esqueleto da Fase 0 — o script `ingest:rpi` é implementado na Fase 1 do TASKS.md.
name: Ingestão RPI

on:
  schedule:
    # A RPI é publicada toda terça, mas a infraestrutura do INPI costuma ficar
    # instável na manhã da publicação (visto em 28/07/2026: site inteiro atrás do
    # firewall com 403). Três janelas — a ingestão é idempotente, rodada extra não
    # grava nada em duplicidade.
    # Gotcha: o GitHub desativa `schedule` em repositórios sem atividade há 60+ dias.
    - cron: '0 12 * * 2' # terça 09:00 BRT
    - cron: '0 17 * * 2' # terça 14:00 BRT
    - cron: '0 12 * * 3' # quarta 09:00 BRT (rede de segurança)
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 404 no download da edição = "ainda não publicada": o script deve terminar
      # com sucesso sem gravar nada (o agendamento tenta de novo na próxima terça).
      - name: Ingerir edição da RPI
        run: npm run ingest:rpi --if-present
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Aqui, e não num workflow à parte: o alerta precisa sair junto da detecção.
      # O que falhar continua na fila e é reprocessado pelo alertas.yml diário.
      - name: Enviar alertas da edição processada
        run: npm run alertas:enviar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_RESPONDER_PARA: ${{ secrets.EMAIL_RESPONDER_PARA }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_CRIPTOGRAFIA: ${{ secrets.SMTP_CRIPTOGRAFIA }}
