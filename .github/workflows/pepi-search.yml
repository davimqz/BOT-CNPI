# Busca ao vivo no pePI sob demanda (ver CLAUDE.md Seção 3.1 e skill pepi-scraping-playbook).
# Disparado pela API do Next.js via workflow_dispatch; o resultado é gravado no Postgres
# associado ao job_id, e o frontend faz polling até aparecer.
# Esqueleto da Fase 0 — o script `search:pepi` é implementado na Fase 2 do TASKS.md.
name: Busca pePI

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'ID do job de busca criado pela API (linha na tabela de jobs)'
        required: true
        type: string
      termo:
        description: 'Termo buscado (nome da marca, número de processo ou titular/CPF/CNPJ)'
        required: true
        type: string
      tipo_busca:
        description: 'Tipo de busca no pePI'
        required: true
        type: choice
        options:
          - radical
          - exata
          - processo
          - titular

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Container oficial do Playwright: já vem com o Chromium E as dependências
    # de SO pré-instaladas (não precisa mais de `playwright install --with-deps`
    # nem de cachear o binário do navegador — isso sozinho cortava 15-40s por
    # busca sob demanda, numa VM efêmera onde pacote de sistema via apt nunca
    # ficava em cache de verdade). A tag de versão PRECISA acompanhar a versão
    # do `playwright` em package.json/package-lock.json (hoje 1.62.0) — se
    # atualizar o pacote, atualizar a tag da imagem junto, senão a versão do
    # driver Node diverge da versão do navegador dentro da imagem.
    # `--user 1001`: roda como não-root — o Chromium recusa abrir o sandbox
    # como root (`chromium.launch()` em search.ts não passa `--no-sandbox`), e
    # containers de job do GitHub Actions rodam como root por padrão sem essa
    # opção. Padrão documentado oficialmente em playwright.dev/docs/ci.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-jammy
      options: --user 1001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # node_modules só muda quando package-lock.json muda — cachear evita
      # reinstalar 750+ pacotes (~20-25s) a cada busca sob demanda.
      - name: Cache de node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar dependências
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # `npm ci` roda `prisma generate` no postinstall, mas node_modules cacheado
      # não carrega `src/generated/prisma` (fica fora de node_modules e é
      # gitignored) — regenerar aqui é rápido (~200ms) e evita pular esse passo
      # quando o cache acima bate.
      - name: Gerar cliente Prisma (cache de node_modules já quente)
        if: steps.cache-node-modules.outputs.cache-hit == 'true'
        run: npx prisma generate

      # A sanidade (npm run sanity:pepi) NÃO roda mais aqui em toda busca — ela
      # abria uma sessão completa de login+query só para validar layout, dobrando
      # o tempo de cada busca sob demanda. Ela roda 1x/dia no pepi-monitor.yml.
      # Trade-off consciente: se o pePI mudar de layout entre uma rodada diária
      # e outra, uma busca sob demanda nessa janela pode não ser pega pela
      # sanidade — mas `search.ts` já lança SiteMudouError inline quando um
      # formulário/elemento esperado não é encontrado, então não fica cego.
      # Ver skill pepi-scraping-playbook.

      - name: Buscar no pePI
        run: npm run search:pepi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JOB_ID: ${{ inputs.job_id }}
          TERMO: ${{ inputs.termo }}
          TIPO_BUSCA: ${{ inputs.tipo_busca }}

      # Rede de segurança do polling da tela. O `search:pepi` marca `erro`
      # quando ELE falha, mas tudo que quebra ANTES dele — a sanidade (que não
      # conhece o job), o `npm ci`, o download do navegador, o timeout do runner
      # — deixava o job em `pendente` para sempre, e a tela em "consultando o
      # INPI…" eternamente. Esperar sem motivo é pior que receber "falhou".
      - name: Marcar o job como falho
        if: failure() || cancelled()
        run: npm run falha:pepi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JOB_ID: ${{ inputs.job_id }}
