# Busca ao vivo no pePI sob demanda (ver CLAUDE.md Seção 3.1 e skill pepi-scraping-playbook).
# Disparado pela API do Next.js via workflow_dispatch; o resultado é gravado no Postgres
# associado ao job_id, e o frontend faz polling até aparecer.
# Esqueleto da Fase 0 — o script `search:pepi` é implementado na Fase 2 do TASKS.md.
name: Busca pePI

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'ID do job de busca criado pela API (linha na tabela de jobs)'
        required: true
        type: string
      termo:
        description: 'Termo buscado (nome da marca, número de processo ou titular/CPF/CNPJ)'
        required: true
        type: string
      tipo_busca:
        description: 'Tipo de busca no pePI'
        required: true
        type: choice
        options:
          - radical
          - exata
          - processo
          - titular

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      # Falha alto se o pePI mudou de layout — nunca confiar em resultados de
      # uma estrutura de página não reconhecida (skill pepi-scraping-playbook).
      - name: Sanidade do pePI (estrutura da página)
        run: npm run sanity:pepi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Buscar no pePI
        run: npm run search:pepi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JOB_ID: ${{ inputs.job_id }}
          TERMO: ${{ inputs.termo }}
          TIPO_BUSCA: ${{ inputs.tipo_busca }}

      # Rede de segurança do polling da tela. O `search:pepi` marca `erro`
      # quando ELE falha, mas tudo que quebra ANTES dele — a sanidade (que não
      # conhece o job), o `npm ci`, o download do navegador, o timeout do runner
      # — deixava o job em `pendente` para sempre, e a tela em "consultando o
      # INPI…" eternamente. Esperar sem motivo é pior que receber "falhou".
      - name: Marcar o job como falho
        if: failure() || cancelled()
        run: npm run falha:pepi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JOB_ID: ${{ inputs.job_id }}
