# Monitoramento diário das marcas de fonte `scraping` (Fase 3 do TASKS.md).
# As marcas de fonte `rpi` NÃO passam por aqui — elas são cruzadas dentro do
# próprio rpi-ingestion.yml, contra a edição recém-processada.
#
# Por que uma vez ao dia, e não "a cada N minutos": o `schedule` do GitHub Actions
# é best-effort (roda quando há runner livre, atrasos de dezenas de minutos são
# normais) e cada marca abre um Chrome headless contra o pePI, que precisa de
# espaçamento deliberado (skill pepi-scraping-playbook). Prometer intervalo fino
# na variante gratuita seria promessa que a infraestrutura não sustenta.
name: Monitor pePI

on:
  schedule:
    # Gotcha: o GitHub desativa `schedule` em repositórios sem atividade há 60+ dias.
    - cron: '0 11 * * *' # todo dia 08:00 BRT
  workflow_dispatch:
    inputs:
      max_marcas:
        description: 'Teto de marcas nesta rodada (padrão 25)'
        required: false
        type: string

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Container oficial do Playwright — já vem com Chromium + deps de SO. Ver
    # comentário completo em pepi-search.yml (mesmo padrão nos dois workflows).
    # A tag de versão PRECISA acompanhar o `playwright` de package.json (hoje
    # 1.62.0). `--user 1001`: não-root, porque chromium.launch() aqui não passa
    # `--no-sandbox` e o Chromium recusa sandbox como root.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-jammy
      options: --user 1001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache de node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar dependências
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Gerar cliente Prisma (cache de node_modules já quente)
        if: steps.cache-node-modules.outputs.cache-hit == 'true'
        run: npx prisma generate

      # Falha alto se o pePI mudou de layout — sem isso, uma mudança de página
      # apareceria como "todos os processos sumiram" em vez de erro (skill
      # pepi-scraping-playbook).
      - name: Sanidade do pePI (estrutura da página)
        run: npm run sanity:pepi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Verificar marcas monitoradas por scraping
        run: npm run monitor:pepi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PEPI_MONITOR_MAX_MARCAS: ${{ inputs.max_marcas }}

      # Aqui, e não num workflow à parte: o alerta precisa sair junto da detecção.
      # O que falhar continua na fila e é reprocessado pelo alertas.yml diário.
      - name: Enviar alertas das movimentações detectadas
        run: npm run alertas:enviar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_RESPONDER_PARA: ${{ secrets.EMAIL_RESPONDER_PARA }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_CRIPTOGRAFIA: ${{ secrets.SMTP_CRIPTOGRAFIA }}
